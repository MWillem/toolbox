name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer le projet
        run: python -m pip install .

      - name: Vérifier l'installateur Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: install.bat

      - name: Vérifier l'installateur Unix
        if: runner.os != 'Windows'
        run: sh install.sh

      - name: Exécuter les tests
        run: python -m unittest discover -s tests -v

      - name: Vérifier le lanceur Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: run.bat --version

      - name: Vérifier le lanceur Unix
        if: runner.os != 'Windows'
        run: sh run.sh --version

      - name: Vérifier la CLI installée
        run: python -m cybertoolbox --version
